<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gestura turns webcam hand gestures into slides, music, and volume controls. All processing happens on your device."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Gestura</title>
    <script>
      try {
        var raw = localStorage.getItem("gestura-settings");
        var state = raw ? JSON.parse(raw).state : null;
        var theme = state && state.theme === "light" ? "light" : "dark";
        var reduce = Boolean(state && state.reduceMotion);
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.classList.toggle("reduce-motion", reduce);
      } catch (error) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
